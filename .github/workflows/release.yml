name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.0.1，不含 v）'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 版本号
        id: ver
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $v = '${{ github.event.inputs.version }}'
          } else {
            $v = '${{ github.ref_name }}'.TrimStart('v')
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "版本：$v"

      - name: 发布（自包含单文件）
        shell: pwsh
        run: |
          dotnet publish HarmoPlay.csproj -c Release -r win-x64 `
            --self-contained true -p:PublishSingleFile=true -p:DebugType=none `
            -p:Version=${{ steps.ver.outputs.version }} `
            -o dist

      - name: 组装发布包
        id: assemble
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $pkg = "HarmoPlay-$v-win-x64"
          New-Item -ItemType Directory -Force -Path "package/$pkg" | Out-Null
          Copy-Item dist/* "package/$pkg" -Recurse -Force
          Copy-Item 使用说明.txt "package/$pkg/使用说明.txt" -Force
          # 开源声明与许可证必须随包分发（署名要求写在里面）
          if (Test-Path '开源声明.md') { Copy-Item '开源声明.md' "package/$pkg/开源声明.md" -Force }
          if (Test-Path 'LICENSE') { Copy-Item 'LICENSE' "package/$pkg/LICENSE" -Force }
          Copy-Item docs/首次运行说明.txt "package/$pkg/首次运行说明.txt" -Force
          if (Test-Path 'tools/输入自检.cmd') { Copy-Item 'tools/输入自检.cmd' "package/$pkg/输入自检.cmd" -Force }
          if (Test-Path 'tools/解除下载锁定.cmd') { Copy-Item 'tools/解除下载锁定.cmd' "package/$pkg/解除下载锁定.cmd" -Force }
          # 文档与示例（Resources -> 文档与示例\）：与 tools/make-release.ps1 保持一致，
          # 否则 Actions 打出来的包会比本地包少这几个文件，而 README/使用说明正好承诺了它们。
          if (Test-Path 'Resources') {
            New-Item -ItemType Directory -Force -Path "package/$pkg/文档与示例" | Out-Null
            Copy-Item 'Resources/*' "package/$pkg/文档与示例" -Force
          }
          if (Test-Path "package/$pkg/HarmoPlay.exe") {
            Rename-Item "package/$pkg/HarmoPlay.exe" "口琴谱演奏器.exe"
          }
          "pkg=$pkg" >> $env:GITHUB_OUTPUT

      - name: 代码签名（可选；配置了 SIGN_PFX_BASE64 才执行）
        # ★ 注意：secrets 上下文**不能**出现在 if 里（GitHub 会判定 workflow 非法，
        #   表现为整个 run「No jobs were run」）。所以先用 env 把密钥带进来，再用 env 判断。
        if: ${{ env.SIGN_PFX_BASE64 != '' }}
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' -ErrorAction SilentlyContinue |
                      Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw '找不到 signtool.exe' }
          $exe = "package/${{ steps.assemble.outputs.pkg }}/口琴谱演奏器.exe"
          & $signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com `
              /f $pfx /p $env:SIGN_PFX_PASSWORD $exe
          if ($LASTEXITCODE -ne 0) { throw "签名失败，退出码 $LASTEXITCODE" }
          Remove-Item $pfx -Force
          Write-Host '签名完成 ✓'

      - name: 压缩并计算 SHA256
        id: pack
        shell: pwsh
        run: |
          $pkg = '${{ steps.assemble.outputs.pkg }}'
          Compress-Archive -Path "package/$pkg/*" -DestinationPath "package/$pkg.zip" -Force
          $hash = (Get-FileHash "package/$pkg.zip" -Algorithm SHA256).Hash.ToLower()
          "sha=$hash" >> $env:GITHUB_OUTPUT
          Write-Host "SHA256=$hash"

      - name: 更新 update.json
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $repo = '${{ github.repository }}'
          $manifest = [ordered]@{
            version   = $v
            published = (Get-Date -Format 'yyyy-MM-dd')
            notes     = "见 Release 说明"
            download  = "https://github.com/$repo/releases/latest"
            mandatory = $false
            sha256    = '${{ steps.pack.outputs.sha }}'
          }
          $manifest | ConvertTo-Json -Depth 4 | Set-Content update.json -Encoding UTF8

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.ver.outputs.version }}
          tag_name: ${{ github.ref_name }}
          files: package/*.zip
          body: |
            下载 `HarmoPlay-${{ steps.ver.outputs.version }}-win-x64.zip`，解压后直接运行 `口琴谱演奏器.exe`。
            （自包含，无需安装 .NET；请保持 5 个原生 DLL 与 exe 在一起）

            SHA256：`${{ steps.pack.outputs.sha }}`

            > 若 Windows 弹出「已保护你的电脑 / 发布者未知」，点「更多信息 → 仍要运行」即可，
            > 原因与彻底解决办法见包内 `首次运行说明.txt` 与仓库 `docs/代码签名.md`。

            > **开源声明**：允许使用、修改、二次分发与整合进自己的作品，但**必须**在创作者页面 /
            > 作品说明中明确标出作者 **chaosheng** 与本项目地址
            > ${{ github.server_url }}/${{ github.repository }}（详见仓库 `开源声明.md`）。

      - name: 提交新的 update.json
        shell: pwsh
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add update.json
          if (git diff --cached --quiet) { Write-Host "无变化" } else {
            git commit -m "chore: 更新 update.json 到 ${{ steps.ver.outputs.version }}"
            git push origin HEAD:${{ github.event.repository.default_branch }}
          }
